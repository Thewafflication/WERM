name: Build and Test

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: ${{ matrix.architecture }} Debug evidence and Release package
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x86
          - x64

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) {
            throw 'MSBuild was not found on the GitHub runner.'
          }
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Debug
        shell: pwsh
        run: >-
          ./tools/Build-Werm.ps1
          -Architecture '${{ matrix.architecture }}'
          -Configuration Debug
          -MSBuildPath $env:MSBUILD_PATH
          -Clean

      - name: Run controlled Debug tests
        shell: pwsh
        run: >-
          ./tools/Run-WermTests.ps1
          -Architecture '${{ matrix.architecture }}'
          -Configuration Debug
          -NoBuild

      - name: Verify Debug Windows version resources
        shell: pwsh
        run: >-
          ./tools/Test-WermVersionResources.ps1
          -Architecture '${{ matrix.architecture }}'
          -Configuration Debug
          -Version '0.1.0'

      - name: Build pinned SQLite ODBC runtime
        shell: pwsh
        run: >-
          ./tools/Build-SqliteOdbc.ps1
          -Architecture '${{ matrix.architecture }}'

      - name: Bootstrap pinned Waughtal Shell
        shell: pwsh
        run: |
          $architecture = '${{ matrix.architecture }}'
          $archive = Join-Path $env:RUNNER_TEMP "wsh-$architecture-1.4.0.zip"
          $destination = Join-Path $env:RUNNER_TEMP "wsh-$architecture-1.4.0"
          $expected = if ($architecture -eq 'x64') {
            '0c8a80edf4cd16b89e92fa41818abab70e6e22a1dae9d25c5e0384a386314f78'
          } else {
            'c5c1732513548ca960a2f92b6d92204f646fb3fec8bfcbf31bb7d36cec043da4'
          }
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/Thewafflication/wsh/releases/download/1.4.0/wsh-$architecture-1.4.0.zip" `
            -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "WSH archive digest mismatch. Expected $expected; received $actual."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $wsh = Get-ChildItem -LiteralPath $destination -Recurse `
            -Filter wsh.exe -File | Select-Object -First 1
          if (-not $wsh) {
            throw 'WSH release archive did not contain wsh.exe.'
          }
          "WSH_EXE=$($wsh.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $wsh.FullName --version

      - name: Run real SQLite ODBC and WSH integration
        shell: pwsh
        run: >-
          ./tools/Test-WermSqliteOdbc.ps1
          -Architecture '${{ matrix.architecture }}'
          -WshPath $env:WSH_EXE

      - name: Build Release
        shell: pwsh
        run: >-
          ./tools/Build-Werm.ps1
          -Architecture '${{ matrix.architecture }}'
          -Configuration Release
          -MSBuildPath $env:MSBUILD_PATH
          -Clean

      - name: Verify Release Windows version resources
        shell: pwsh
        run: >-
          ./tools/Test-WermVersionResources.ps1
          -Architecture '${{ matrix.architecture }}'
          -Configuration Release
          -Version '0.1.0'

      - name: Bootstrap pinned WPM
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'wpm-x64-1.0.17.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'wpm-1.0.17'
          Invoke-WebRequest -UseBasicParsing `
            -Uri 'https://github.com/Thewafflication/wpm/releases/download/1.0.17/wpm-x64-1.0.17.zip' `
            -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '7ad65ab64f62a26a638356fa475c0584d44d81d7bf6a8e77c298aa4f92d9ccaa'
          if ($actual -ne $expected) {
            throw "WPM archive digest mismatch. Expected $expected; received $actual."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          & (Join-Path $destination 'setup.cmd') (Join-Path $destination 'wpm.exe')
          if ($LASTEXITCODE -ne 0) {
            throw "WPM setup failed with exit code $LASTEXITCODE."
          }
          $wpm = Join-Path $env:ProgramFiles 'WPM\wpm.exe'
          if (-not (Test-Path -LiteralPath $wpm -PathType Leaf)) {
            throw 'WPM setup did not install wpm.exe.'
          }
          "WPM_DATA_DIR=$env:RUNNER_TEMP\wpm-data" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WPM_EXE=$wpm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $wpm --version

      - name: Build Release WPM package
        shell: pwsh
        run: >-
          ./tools/Build-WpmPackage.ps1
          -Architecture '${{ matrix.architecture }}'
          -Configuration Release
          -Version '0.1.0-ci.${{ github.run_number }}'
          -WpmPath $env:WPM_EXE

      - name: Run clean WPM install, launch, and removal
        shell: pwsh
        run: >-
          ./tools/Test-WermWpmInstall.ps1
          -Architecture '${{ matrix.architecture }}'
          -Version '0.1.0-ci.${{ github.run_number }}'
          -PackagePath 'out/packages/werm-${{ matrix.architecture }}-0.1.0-ci.${{ github.run_number }}.zip'
          -WpmPath $env:WPM_EXE

      - name: Upload controlled evidence and package
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: werm-${{ matrix.architecture }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out/bin/Werm.App/${{ matrix.architecture }}/Debug/Werm.exe
            out/bin/Werm.App/${{ matrix.architecture }}/Debug/*.dll
            out/bin/Werm.App/${{ matrix.architecture }}/Debug/*.pdb
            out/bin/Werm.Core/${{ matrix.architecture }}/Debug/*
            out/bin/Werm.Data/${{ matrix.architecture }}/Debug/*
            out/bin/Werm.Printing/${{ matrix.architecture }}/Debug/*
            out/bin/Werm.Tests/${{ matrix.architecture }}/Debug/*
            out/test-results/${{ matrix.architecture }}/Debug/werm-test-results.xml
            out/release-evidence/version-resources/${{ matrix.architecture }}-debug.json
            out/release-evidence/version-resources/${{ matrix.architecture }}-release.json
            out/integration-results/${{ matrix.architecture }}/*
            out/dependencies/sqlite-odbc/${{ matrix.architecture }}/*
            out/packages/werm-${{ matrix.architecture }}-0.1.0-ci.${{ github.run_number }}.zip

  release-evidence:
    name: Aggregate traceability and candidate report
    needs: build-test-package
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Check out controlled specifications
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive

      - name: Download architecture evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: werm-*-${{ github.sha }}
          path: downloaded-evidence

      - name: Validate traceability and generate test report
        shell: pwsh
        run: |
          $x86Result = Get-ChildItem downloaded-evidence -Recurse `
            -Filter werm-test-results.xml | Where-Object {
              $_.FullName -match '[\\/]x86[\\/]Debug[\\/]'
            } | Select-Object -First 1
          $x64Result = Get-ChildItem downloaded-evidence -Recurse `
            -Filter werm-test-results.xml | Where-Object {
              $_.FullName -match '[\\/]x64[\\/]Debug[\\/]'
            } | Select-Object -First 1
          $x86Package = Get-ChildItem downloaded-evidence -Recurse `
            -Filter 'werm-x86-*.zip' | Select-Object -First 1
          $x64Package = Get-ChildItem downloaded-evidence -Recurse `
            -Filter 'werm-x64-*.zip' | Select-Object -First 1
          $integrationResults = @(Get-ChildItem downloaded-evidence -Recurse `
            -Include 'tc-0025.json','tc-0028.json' -File)
          foreach ($input in @($x86Result, $x64Result, $x86Package, $x64Package)) {
            if (-not $input) {
              throw 'The architecture evidence set is incomplete.'
            }
          }
          if ($integrationResults.Count -ne 4) {
            throw "Expected four architecture integration results; found $($integrationResults.Count)."
          }

          ./tools/Test-WermTraceability.ps1 `
            -ResultsPath @($x86Result.FullName, $x64Result.FullName) `
            -IntegrationResultsPath $integrationResults.FullName `
            -ManualResultsPath 'docs/releases/0.1.0-manual-results.json'
          ./tools/New-WermTestReport.ps1 `
            -SourceRevision $env:GITHUB_SHA `
            -X86ResultsPath $x86Result.FullName `
            -X64ResultsPath $x64Result.FullName `
            -X86PackagePath $x86Package.FullName `
            -X64PackagePath $x64Package.FullName `
            -IntegrationResultsPath $integrationResults.FullName `
            -ManualResultsPath 'docs/releases/0.1.0-manual-results.json' `
            -WpmVersion '1.0.17 (CI pinned)'

      - name: Upload aggregate release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: werm-release-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out/release-evidence/*
            docs/releases/0.1.0-manual-results.json
